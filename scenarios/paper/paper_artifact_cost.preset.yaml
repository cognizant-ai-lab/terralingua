# Ablation introducing a cost for creating artifacts.
# From paper_experiment_scripts/run_artifact_cost.sh of the first public release.
name: paper_artifact_cost
description: Ablation introducing a cost for creating artifacts.
config:
  run:
    exp_name: artifact_cost
    exp_description: Ablation introducing a cost for creating artifacts.
    max_ts: 3000
    env_heartbeat: -1
    ckpt_interval: 100
    save_video: true
    video_fps: 10
  agent:
    model: DeepSeek-R1-32
    scenario_specific_instructions: base
    genome: ocean_5
    max_history: 1
    internal_memory_size: 150
  env:
    grid_size: 50
    init_agents: 20
    init_agent_energy: 50
    food_zones: 1
    food_spawn_rate: 1
    agent_lifespan: 100
    vision_radius: 6
    drop_food_on_death: true
    artifact_creation_cost: 10
    reproduction_cost: 50
    dynamic_grid_scaling: false
