[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terralingua"
version = "0.2.1"
description = "Multi-agent simulation framework where LLM-powered beings live in a shared world, with an AI anthropologist that annotates the run."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    # world, agents, config
    "numpy>=2",
    "pandas",
    "networkx",
    "pygame",
    "Pillow",
    "requests",
    "tiktoken",
    "jinja2",
    "tqdm",
    "pyyaml",
    "pydantic>=2",
    "jsonschema>=4.18,<5",
    "python-dotenv",
    "wonderwords",
    "pyhocon",
    # LLM clients and genomes
    "litellm>=1.90.2",
    "openai",
    "torch",
    "transformers",
    # anthropologist
    "matplotlib",
    "scikit-learn",
    "datasets",
    "spacy",
    "cdlib",
    "zstandard",
    "joblib",
    # external MCP servers
    "mcp",
    "flask",
    # dashboard and API
    "fastapi",
    "uvicorn[standard]",
    "starlette",
    "itsdangerous",
    "fastapi-users[sqlalchemy]",
    "sqlalchemy",
    "asyncpg",
    "slowapi",
    "cryptography",
    "aiosmtplib",
    "redis[hiredis]<8",
]

[project.optional-dependencies]
# Libraries used only by the notebooks under analysis_scripts/.
analysis = ["jupyter", "plotly>=6", "scipy", "umap-learn", "hdbscan", "mplcursors", "graphviz", "pydot"]

[project.scripts]
terralingua = "terralingua.cli:main"
terralingua-dashboard = "terralingua.server.cli:main"
terralingua-anthropologist = "terralingua.anthropologist.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["terralingua*"]
exclude = ["logs*", "plots*", "*.egg-info", "__pycache__"]

[tool.setuptools.package-data]
terralingua = ["agents/prompts/*.j2", "server/static/**/*", "anthropologist/tags.json"]

[tool.pytest.ini_options]
# Makes the repo root the pytest rootdir from any working directory, so conftest.py applies.
minversion = "7.0"

[tool.ruff]
# Format all Python files
include = ["*.py"]
exclude = ["__pycache__", ".venv", ".ruff_cache", ".git", "*.egg-info"]

# Set the line length to match Black / PEP8-style defaults
line-length = 88

# Apply all default linting rules except F401 (unused imports)
select = ["E", "F", "W", "I"]  # E: pycodestyle, F: pyflakes, W: warnings, I: isort
ignore = ["F401"]

# Enable import sorting (compatible with isort)
fix = true

# Show full rule explanations if desired
show-fixes = true

# Use this to format code with Ruff as well
[tool.ruff.format]
quote-style = "double"  # or "single" if preferred
indent-style = "space"

[tool.ruff.lint]
# Optional: Only apply linting to these folders
# path = ["src", "tests"]

# Optional: If you're using __all__ and want to allow unused imports for that
dummy-variable-rgx = "^_"  # allow names like _ or _var

[tool.ruff.lint.per-file-ignores]
# Example: ignore unused import warnings in __init__.py
"__init__.py" = ["F401"]
