# Redis configuration for TerraLingua (local demo)
#
# Redis is used purely as an in-memory pub/sub bus + coordination cache.
# Local demo state is ephemeral by design — the container loses everything
# on removal anyway — so persistence and auth are both off intentionally.
# Durable state in real deployments lives in Postgres + logs/<exp>/; see
# demo/live/redis.conf for the rationale.

bind 127.0.0.1 -::1
port 6379
protected-mode yes

# Disable RDB snapshots
save ""

# Disable AOF
appendonly no

# Logging: stdout (captured by supervisord)
logfile ""
loglevel notice
