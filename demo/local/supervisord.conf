[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
pidfile=/tmp/supervisord.pid

[program:postgres]
# PG_BIN is exported into /app/.env by docker-entrypoint.sh.
command=bash -c "set -a && source /app/.env && set +a && exec $PG_BIN/postgres -D $PGDATA"
user=postgres
autostart=true
autorestart=true
priority=5
startsecs=3
stdout_logfile=/app/logs/postgres.log
stderr_logfile=/app/logs/postgres.log

[program:redis]
command=redis-server /app/demo/local/redis.conf --daemonize no
autostart=true
autorestart=true
priority=10
stdout_logfile=/app/logs/redis.log
stderr_logfile=/app/logs/redis.log

[program:api]
command=/app/demo/local/start-api.sh
directory=/app
autostart=true
autorestart=true
startretries=10
priority=20
startsecs=5
stdout_logfile=/app/logs/api.log
stderr_logfile=/app/logs/api.log

[program:runner]
command=bash -c "set -a && source /app/.env && set +a && terralingua ${TERRALINGUA_PRESET} ${TERRALINGUA_RUNNER_ARGS:-}"
directory=/app
autostart=true
autorestart=true
startretries=10
priority=30
startsecs=8
stdout_logfile=/app/logs/runner.log
stderr_logfile=/app/logs/runner.log

[program:anthropologist]
command=bash -c "set -a && source /app/.env && set +a && terralingua-anthropologist --exp_name ${TERRALINGUA_EXP_NAME} --model claude-haiku-4-5 --detect-interval 3"
directory=/app
autostart=true
autorestart=true
startretries=5
priority=40
startsecs=15
stdout_logfile=/app/logs/anthropologist.log
stderr_logfile=/app/logs/anthropologist.log
