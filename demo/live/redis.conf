# Redis configuration for TerraLingua (live demo)
#
# Redis is used purely as an in-memory pub/sub bus + coordination cache
# between the runner, API server, and anthropologist. Durable state lives
# elsewhere by design:
#   - User accounts / access tokens     → Postgres
#   - Simulation state / agent positions → runner process + logs/<exp>/checkpoints/
#   - Field notes                       → logs/<exp>/field_notes.jsonl (Redis caches them)
# What Redis holds is transient WS coordination: last broadcast frame
# (regenerated next tick), one-time session tokens, anon heartbeat keys,
# bg-owner locks, artifact ownership records.
#
# Persistence is intentionally OFF. Restoring a stale snapshot causes
# subtle bugs (old subscribers, stale dashboard state), and nothing in
# Redis is irrecoverable — worst case a Redis restart prompts users to
# refresh, and the system self-heals within one env tick.
#
# Auth (requirepass) is OFF because Redis is bound to 127.0.0.1 inside
# the container; the perimeter is the container boundary, not the port.
# If Redis is ever moved out of the container, add requirepass here and
# embed the credential in REDIS_URL.

bind 127.0.0.1 -::1
port 6379
protected-mode yes

maxclients 50000

# Disable RDB snapshots
save ""

# Disable AOF
appendonly no

# Logging: stdout (captured by supervisord)
logfile ""
loglevel notice
