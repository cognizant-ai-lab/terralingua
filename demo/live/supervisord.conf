[supervisord]
nodaemon=true
logfile=/app/data/run_logs/supervisord.log
logfile_maxbytes=10MB
pidfile=/tmp/supervisord.pid

[program:postgres]
# PG_BIN is exported into /app/.env by docker-entrypoint.sh.
command=bash -c "set -a && source /app/.env && set +a && exec $PG_BIN/postgres -D $PGDATA"
user=postgres
autostart=true
autorestart=true
priority=5
startsecs=3
stdout_logfile=/app/data/run_logs/postgres.log
stderr_logfile=/app/data/run_logs/postgres.log

[program:redis]
command=redis-server /app/demo/live/redis.conf --daemonize no
autostart=true
autorestart=true
priority=10
stdout_logfile=/app/data/run_logs/redis.log
stderr_logfile=/app/data/run_logs/redis.log

[program:api]
command=/app/demo/live/start-api.sh
directory=/app
autostart=true
autorestart=true
startretries=10
priority=20
startsecs=5
stdout_logfile=/app/data/run_logs/api.log
stderr_logfile=/app/data/run_logs/api.log

[program:runner]
command=/app/demo/live/start-runner.sh
directory=/app
autostart=true
autorestart=true
startretries=10
priority=30
startsecs=8
# Give the runner up to 60s to finish its current tick, save a checkpoint,
# and tear down cleanly on SIGTERM before supervisord SIGKILLs it. Docker's
# --stop-timeout in run.sh is set to accommodate this.
stopwaitsecs=60
stdout_logfile=/app/data/run_logs/runner.log
stderr_logfile=/app/data/run_logs/runner.log

[program:anthropologist]
command=/app/demo/live/start-anthropologist.sh
directory=/app
autostart=true
autorestart=true
startretries=5
priority=40
startsecs=15
# Allow in-flight LLM calls / postmortems to finish on SIGTERM.
stopwaitsecs=30
stdout_logfile=/app/data/run_logs/anthropologist.log
stderr_logfile=/app/data/run_logs/anthropologist.log
